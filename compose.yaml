services:
  kingdom-forge:
    build: .
    image: kingdom-forge:2.3.0
    container_name: kingdom-forge
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: America/New_York
      DATA_DIR: /data
      COOKIE_SECURE: "true"
      BACKUP_RETENTION: "14"
    ports:
      - "3000:3000"
    volumes:
      - kingdom-forge-data:/data
    networks:
      - kingdom-forge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    labels:
      homepage.group: D&D
      homepage.name: Kingdom Forge
      homepage.description: Character sheets and dice roller
      homepage.icon: mdi-dice-d20
      homepage.href: https://kingdom-forge-tail.kingdom.local

networks:
  kingdom-forge:
    name: kingdom-forge

volumes:
  kingdom-forge-data:
    name: kingdom-forge-data
