services:
  kingdom-forge:
    build:
      context: .
      dockerfile: Dockerfile
    image: kingdom-forge:2.5.3
    container_name: kingdom-forge
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: America/New_York
      DATA_DIR: /data
      COOKIE_SECURE: "true"
      BACKUP_RETENTION: "14"
    volumes:
      - kingdom-forge-data:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    labels:
      homepage.group: D&D
      homepage.name: Kingdom Forge
      homepage.description: Character sheets, campaigns, and animated dice
      homepage.icon: mdi-dice-d20
      homepage.href: https://kingdom-forge-tail.kingdom.local

networks:
  proxy:
    external: true

volumes:
  kingdom-forge-data:
    name: kingdom-forge-data
